<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>Hello Neutralinojs</title>
  <style>
    /* 四邊圓角 */
    html {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    .container {
      background-color: white;
      border-radius: 0.5rem;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 1rem;
    }

    .font-ch {
      font-family: '微軟正黑體';
      font-weight: bold;
      font-size: 10cqh;
    }
    .font-n {
      font-family: 'Comic Sans MS';
      font-size: 20cqh;
    }

    #time-div span {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .button .font-ch, .button .font-n {
      font-size: 10cqh;
    }
    #countdown-div .font-ch {
      font-size: 7cqw;
    }
  </style>
</head>

<body>
  <div class="container" style="text-align: center; display: grid; grid-template-rows: repeat(3, 1fr)">
    <div id="time-div" class="font-n" style="display: grid; grid-template-columns: repeat(10, 1fr)">
      <span></span>
      <span id="hour-1"></span>
      <span id="hour-2"></span>
      <span>:</span>
      <span id="minute-1"></span>
      <span id="minute-2"></span>
      <span>:</span>
      <span id="second-1"></span>
      <span id="second-2"></span>
      <span></span>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; gap: 2rem;">
      <button class="button" style="border-radius: 1rem; height: 6rem; width: 20rem;" onclick="minimize()">
        <span class="font-ch">縮小</span>
        <span class="font-n">&nbsp;5&nbsp;</span>
        <span class="font-ch">秒鐘</span>
      </button>
      <button class="button" style="border-radius: 1rem; height: 6rem; width: 20rem;" onclick="delay()">
        <span class="font-ch">延遲</span>
        <span class="font-n">&nbsp;10&nbsp;</span>
        <span class="font-ch">分鐘</span>
      </button>
    </div>
    <div id="countdown-div" style="display: flex; flex-direction: row; justify-content: center; align-items: center;">
      <span id="countdown" class="font-n" style="width: 25%; text-align: right;">20</span>
      <span class="font-ch" style="margin-left: 1rem; width: 75%; text-align: left;">秒後即將強制關機！</span>
    </div>
  </div>
  <script src="./neutralino.js"></script>
  <script src="./main.js"></script>
</body>

</html>
